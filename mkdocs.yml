site_name: Aray
site_description: Generate benign ELF, PE, and format-specific artifacts that match YARA rules.
site_author: Lab-C2DC
site_url: https://c2dc.github.io/aray/

repo_name: c2dc/aray
repo_url: https://github.com/c2dc/aray
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: aray-logo.png
  favicon: aray-logo.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Evaluation: evaluation.md
  - Examples: examples.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/aray-v2.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/c2dc/aray
      name: Aray on GitHub

copyright: Aray - a research collaboration across academia and industry
